# Le schéma vu par le client, pas celui vu par nginx.
#
# Traefik termine le TLS et parle à ce conteneur en clair : `$scheme` y vaut
# donc `http`, alors que le visiteur est en `https`. Une politique construite
# sur `$scheme` nomme la mauvaise origine, et le pont du cadre sablé — dont
# l'origine est opaque, donc qui ne peut pas s'appuyer sur `'self'` — n'est
# jamais chargé. Mesuré en production le 2026-09-07 : `/sandbox.html` répondait
# 200 et son module n'était jamais demandé.
map $http_x_forwarded_proto $client_scheme {
  # Servi en direct, sans proxy devant : le schéma de nginx est le bon.
  default $scheme;
  https https;
  http http;
}

server {
  listen 80;
  listen [::]:80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  # `script-src` autorise `unsafe-eval`, et c'est un arbitrage, pas un oubli :
  # les agents écrivent le code de leurs outils pendant le run, et ce code est
  # évalué dans l'onglet. Sans cette autorisation, aucun outil imprévu ne peut
  # exister — l'usine ne saurait qu'assembler un vocabulaire fermé.
  #
  # Ce que la politique tient malgré tout : aucune source de script externe,
  # aucune origine réseau hors relais et fournisseur, aucun cadre, aucun
  # formulaire sortant. Le code évalué vient du modèle, il est affiché au
  # visiteur avant de tourner, et la porte humaine reste devant la livraison.
  #
  # `frame-src 'self'` est le SEUL assouplissement qu'a demandé l'application
  # vivante : le cadre est une page que nous servons (`/sandbox.html`), sablée
  # sans `allow-same-origin`, donc d'origine opaque. Elle porte sa propre
  # politique ci-dessous, plus stricte que celle de l'hôte.
  #
  # `style-src` autorise `unsafe-inline` parce que Vue pose des styles en
  # ligne ; `style-src` et `font-src` ouvrent Google Fonts, seule ressource
  # externe de la page. `connect-src` n'ouvre `api.anthropic.com` que pour le
  # mode LLM branché — en mode par défaut, aucune requête ne part.
  set $policy "default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://api.anthropic.com; object-src 'none'; frame-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'";

  # nginx n'hérite PAS les `add_header` d'un niveau supérieur dès qu'un bloc
  # en déclare un : chaque `location` doit donc les redéclarer, sans quoi les
  # fragments seraient servis sans politique de sécurité.

  # Le service compagnon, dans son propre conteneur. Le navigateur ne parle qu’à
  # la même origine — la clé OpenRouter ne quitte jamais le serveur, et
  # `connect-src 'self'` suffit. nginx ne sort pas de la machine : le relais
  # écoute en local, sur la boucle, et n'est joignable par personne d'autre.
  #
  # Relais arrêté : la route rend 502, la sonde échoue, et le site retombe sur
  # sa démonstration rejouée — ce qu'il annonce à l'écran.
  location ~ ^/api/(.*)$ {
    add_header Content-Security-Policy $policy always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control "no-store" always;
    proxy_pass http://api:8000/$1$is_args$args;
    proxy_set_header Host $host;
    # Sans quoi le relais verrait une seule adresse pour tous les visiteurs,
    # et sa limite par minute serait partagée par la planète entière.
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 40s;
  }

  # Le cadre isolé. Sa politique est la plus stricte du site : il n'évalue
  # rien, ne parle à personne, et ne charge que son propre pont.
  #
  # `script-src` nomme l'hôte explicitement au lieu de `'self'` : l'iframe est
  # sablée sans `allow-same-origin`, son origine est donc opaque, et `'self'`
  # ne correspondrait à rien — le pont serait bloqué. Une source d'hôte, elle,
  # se compare à l'adresse du script.
  location = /sandbox.html {
    add_header Content-Security-Policy "default-src 'none'; script-src $client_scheme://$host; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  location /assets/ {
    # Le pont du cadre sablé est un module ES, et un module est toujours
    # récupéré en mode CORS — l'attribut `crossorigin` que pose le bundler n'y
    # change rien. Le cadre a une origine opaque, il demande donc ce fichier
    # avec `Origin: null`, et sans cette autorisation le navigateur refuse la
    # réponse avant de l'exécuter : le pont ne s'annonce jamais et l'écran ne
    # se monte pas. Mesuré en production le 2026-09-07.
    #
    # Ce que ça ouvre : rien. Ces fichiers sont déjà publics et servis à qui
    # les demande ; l'en-tête autorise seulement un script d'une autre origine
    # à lire ce qu'un `<script src>` obtenait déjà. Aucun cookie ne
    # l'accompagne — l'autorisation ne vaut pas pour les requêtes créditées.
    add_header Access-Control-Allow-Origin "*" always;
    add_header Content-Security-Policy $policy always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location / {
    add_header Content-Security-Policy $policy always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header X-Frame-Options "DENY" always;
    # L'index n'est jamais immuable : un index périmé référencerait des
    # fragments hachés qui n'existent plus.
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /index.html;
  }
}
