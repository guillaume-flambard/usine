# Le schéma vu par le client, pas celui vu par nginx.
#
# Traefik termine le TLS et parle à ce conteneur en clair : `$scheme` y vaut
# donc `http`, alors que le visiteur est en `https`. Une politique construite
# sur `$scheme` nomme la mauvaise origine, et le pont du cadre sablé — dont
# l'origine est opaque, donc qui ne peut pas s'appuyer sur `'self'` — n'est
# jamais chargé. Mesuré en production le 2026-09-07 : `/sandbox.html` répondait
# 200 et son module n'était jamais demandé.
map $http_x_forwarded_proto $client_scheme {
  # Servi en direct, sans proxy devant : le schéma de nginx est le bon.
  default $scheme;
  https https;
  http http;
}

# L'atelier : la seule page du produit, racine de son propre hôte.
#
# Elle est séparée de la vitrine par l'hôte et pas par un chemin, et c'est ce qui
# rend le mot de passe posable : Traefik met `usine-auth` sur ce routeur-la et
# sur aucun autre. Le service compagnon n'est joignable que d'ici, pour la même
# raison — `/api/flotte` et `/api/portes` n'ont aucune authentification à eux.
server {
  listen 80;
  listen [::]:80;
  server_name atelier.memolabs.dev;
  root /usr/share/nginx/html;
  index atelier.html;
  server_tokens off;

  # Plus stricte que celle de la vitrine, parce que cette page fait moins :
  # aucun code de modèle n'y est évalué (donc pas de `unsafe-eval`), aucun cadre
  # sablé n'y est monté (donc pas de `frame-src`), et rien n'y parle à un
  # fournisseur (donc `connect-src 'self'` seul). `style-src 'unsafe-inline'`
  # reste : Vue pose ses styles en ligne. Aucune police externe n'est chargée,
  # la pile système étant le défaut de la bibliothèque.
  set $policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'";

  # Tout `/api` va au service, pas au relais. Le service tient le meme contrat
  # (`/health`, `POST /reason`) en plus de la flotte et des portes : router la
  # moitié ici et l'autre là-bas ferait deux services pour un seul préfixe.
  location ~ ^/api/(.*)$ {
    add_header Content-Security-Policy $policy always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control "no-store" always;
    proxy_pass http://127.0.0.1:3111/$1$is_args$args;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Rejouer une mesure rend la main tout de suite ; c'est la lecture des
    # invites, qui traverse Langfuse, qui peut traîner.
    proxy_read_timeout 40s;
  }

  # Le cadre isolé, gardé parce qu'il est servi par cette racine. Sa politique
  # est la plus stricte du site : il n'évalue rien, ne parle à personne, et ne
  # charge que son propre pont.
  #
  # `script-src` nomme l'hôte explicitement au lieu de `'self'` : l'iframe est
  # sablée sans `allow-same-origin`, son origine est donc opaque, et `'self'`
  # ne correspondrait à rien — le pont serait bloqué.
  location = /sandbox.html {
    add_header Content-Security-Policy "default-src 'none'; script-src $client_scheme://$host; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  location /assets/ {
    add_header Content-Security-Policy $policy always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # Le repli est `atelier.html`, pas `index.html` : la vitrine est un autre
  # fichier dans la même racine, et sans ce repli nommé, `/portes` la servirait.
  location / {
    add_header Content-Security-Policy $policy always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /atelier.html;
  }
}
