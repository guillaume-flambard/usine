[project]
name = "usine-api"
version = "0.1.0"
description = "Le service compagnon de l'usine agentique : relais de raisonnement, persistance des runs, mémoire, outils, évaluation."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.118",
    "uvicorn[standard]>=0.38",
    "httpx>=0.28",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "langgraph>=1.2.22,<2",
    "langgraph-checkpoint-postgres>=3.2.1,<4",
    "langchain-openai>=1.8,<2",
    "langfuse>=5.2,<6",
    "pydantic-ai-slim[openai]>=2.68,<3",
    "openai-agents>=0.6",
    "langchain>=1.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["usine_api"]
