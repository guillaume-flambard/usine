<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Application de l'usine</title>
    <!--
      La page du cadre isolé. Elle est servie par nous, sous sa propre
      politique de sécurité, et ne contient que le pont : le balisage écrit par
      un agent arrive par message et n'est jamais exécuté.

      Elle n'est jamais ouverte directement — elle vit dans une iframe sablée,
      d'origine opaque, qui ne peut pas atteindre la page hôte.
    -->
    <style>
      :root {
        color-scheme: light;
        --ink: #16130f;
        --cream: #faf9f7;
        --muted: #6b6560;
        --accent: #ad4c16;
        --line: #e0dbd4;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 20px;
        background: var(--cream);
        color: var(--ink);
        font:
          15px/1.5 ui-sans-serif,
          system-ui,
          sans-serif;
      }
      h1,
      h2,
      h3,
      h4 {
        font-weight: 400;
        letter-spacing: 0.01em;
        margin: 0 0 12px;
      }
      h1 {
        font-size: 20px;
      }
      p,
      ul,
      ol,
      table {
        margin: 0 0 12px;
      }
      label {
        display: block;
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 6px;
      }
      input,
      textarea,
      select {
        width: 100%;
        max-width: 560px;
        padding: 8px 10px;
        border: 1px solid var(--line);
        border-radius: 0;
        background: #fff;
        color: inherit;
        font: inherit;
      }
      textarea {
        min-height: 76px;
        resize: vertical;
      }
      button {
        padding: 8px 16px;
        border: 1px solid var(--ink);
        border-radius: 0;
        background: var(--ink);
        color: var(--cream);
        font: inherit;
        cursor: pointer;
      }
      button[disabled] {
        border-color: var(--line);
        background: transparent;
        color: var(--muted);
        cursor: not-allowed;
      }
      table {
        border-collapse: collapse;
        width: 100%;
      }
      th,
      td {
        border-bottom: 1px solid var(--line);
        padding: 6px 8px;
        text-align: left;
      }
      pre {
        white-space: pre-wrap;
        word-break: break-word;
      }
      /* Written by the bridge, never by an agent. */
      .slot-note {
        display: inline-block;
        margin-left: 8px;
        font-size: 12px;
        color: var(--muted);
      }
      [data-output] {
        margin: 8px 0 12px;
        padding: 10px 12px;
        border-left: 2px solid var(--line);
        white-space: pre-wrap;
        word-break: break-word;
      }
      [data-output][data-failed='true'] {
        border-left-color: var(--accent);
        color: var(--accent);
      }
      .frame-empty {
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div id="screen"><p class="frame-empty">En attente de l'écran…</p></div>
    <script type="module" src="/src/app/sandbox-main.ts"></script>
  </body>
</html>
