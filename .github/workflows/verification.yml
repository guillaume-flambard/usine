name: Vérification

# Les promesses d'interface ne valent que si quelque chose les exécute sans
# qu'on y pense. `pnpm test` seul ne lance pas le projet navigateur : c'est
# ici que les deux passent.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Types
        run: pnpm type-check

      - name: Tests du noyau
        run: pnpm test

      - name: Navigateurs
        run: pnpm exec playwright install --with-deps chromium

      - name: Tests en navigateur
        run: pnpm test:navigateur

      - name: Build
        run: pnpm build

      - name: Image
        run: docker build -t usine-agentique .
