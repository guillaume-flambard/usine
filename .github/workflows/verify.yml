name: Verification

# Interface promises are only worth something if something runs them without
# anyone thinking about it. `pnpm test` alone does not run the browser
# project: this is where both pass.
on:
  workflow_dispatch:
  push:
    branches: [v2]
  pull_request:
    branches: [v2]

permissions:
  contents: read
  statuses: write

jobs:
  verify:
    # PR and main checks run outside the VPS. The production image publisher
    # remains in build.yml and is only triggered on main.
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    # A stale uv.lock must fail the run, never be re-locked quietly.
    env:
      UV_LOCKED: '1'
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      # The Node version comes from .nvmrc, the same file mise reads and the
      # image in Dockerfile.verify follows: one version, three readers, instead
      # of a fourth written here that nobody bumps.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # The companion service has its own tests, and `pnpm lint` lints them.
      # Without uv, verification failed on a missing command rather than on a
      # defect in the code. Pinned to the full tag: upstream no longer
      # publishes floating majors past v7.
      - uses: astral-sh/setup-uv@v10.3.3

      - run: pnpm install --frozen-lockfile

      # Hosted runners provision Chromium dependencies independently of the VPS.
      - name: Browsers
        run: pnpm --filter @usine/web exec playwright install --with-deps chromium

      # The same list of checks the VPS builder runs in Dockerfile.verify
      # (MEM-6). This workflow is only a manual fallback.
      - name: Verify
        timeout-minutes: 15
        run: ./scripts/verify.sh

      - name: Report usine/verify success
        if: success()
        run: |
          SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          gh api repos/${{ github.repository }}/commits/${SHA}/statuses \
            -f state=success \
            -f context=usine/verify \
            -f description="Verification passed" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Report usine/verify failure
        if: failure()
        run: |
          SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          gh api repos/${{ github.repository }}/commits/${SHA}/statuses \
            -f state=failure \
            -f context=usine/verify \
            -f description="Verification failed"
