name: Verification

# Interface promises are only worth something if something runs them without
# anyone thinking about it. `pnpm test` alone does not run the browser
# project: this is where both pass.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    # PR and main checks run outside the VPS. The production image publisher
    # remains in build.yml and is only triggered on main.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # Le service compagnon a ses propres tests, et `pnpm lint` les lint.
      # Sans uv, la vérification échouait sur une commande absente plutôt que
      # sur un défaut du code.
      - uses: astral-sh/setup-uv@v5

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Types
        run: pnpm type-check

      - name: Node tests
        run: pnpm test

      # Hosted runners provision Chromium dependencies independently of the VPS.
      - name: Browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser tests
        timeout-minutes: 8
        run: pnpm test:browser

      - name: Service tests
        run: pnpm test:api

      - name: Build
        run: pnpm build

      - name: Image
        run: docker build -t usine-agentique .
