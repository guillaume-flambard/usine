name: Verification

# Interface promises are only worth something if something runs them without
# anyone thinking about it. `pnpm test` alone does not run the browser
# project: this is where both pass.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    # Runner auto-hébergé : les minutes GitHub sont bloquées (facturation), et un
    # runner à nous fait tourner la même vérification sans dépendre d'elles. Le
    # label « usine » vise le nôtre, pas un runner d'un autre dépôt de l'org.
    # Voir scripts/ci-runner-setup.sh pour l'enrôler (hôte Linux, ex. le VPS).
    runs-on: [self-hosted, linux, usine]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Le service compagnon a ses propres tests, et `pnpm lint` les lint.
      # Sans uv, la vérification échouait sur une commande absente plutôt que
      # sur un défaut du code.
      - uses: astral-sh/setup-uv@v5

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Types
        run: pnpm type-check

      - name: Node tests
        run: pnpm test

      # Sans `--with-deps` : sur un runner auto-hébergé, les dépendances système
      # de Chromium sont installées une fois par le wizard (scripts/ci-runner-setup.sh),
      # ce qui évite un `sudo apt-get` non interactif à chaque CI.
      - name: Browsers
        run: pnpm exec playwright install chromium

      - name: Browser tests
        run: pnpm test:browser

      - name: Service tests
        run: pnpm test:api

      - name: Build
        run: pnpm build

      - name: Image
        run: docker build -t usine-agentique .
