packages:
  - apps/*

# Pulled in by @nuxt/ui, and both need their install script: esbuild fetches its
# platform binary, vue-demi picks the Vue 3 entry point. Left undecided, pnpm
# exits non-zero and every script that starts with an install check fails.
allowBuilds:
  esbuild: true
  vue-demi: true
  # Comes in through `sass-embedded`, added to compile the vendored shell's
  # SCSS. Its install script fetches a prebuilt binary; it only serves file
  # watching, which this repo does not use, but left undecided it makes
  # `pnpm install --frozen-lockfile` exit 1 and CI falls before the type-check.
  '@parcel/watcher': true
  # Its postinstall installs the git hooks (https://lefthook.dev/installation/node/).
  lefthook: true
