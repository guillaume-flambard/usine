server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  # Politique de sécurité stricte : pas d'`unsafe-eval`. Le mode par défaut
  # doit passer dessous. Vérifié à deux endroits : `csp.spec.ts` lit ce
  # fichier et contrôle les directives, et `csp.navigateur.spec.ts` prouve
  # que la fabrication par défaut n'évalue aucun code.
  #
  # `style-src` autorise `unsafe-inline` parce que Vue pose des styles en
  # ligne ; `style-src` et `font-src` ouvrent Google Fonts, seule ressource
  # externe de la page. `connect-src` n'ouvre `api.anthropic.com` que pour le
  # mode LLM branché — en mode par défaut, aucune requête ne part.
  set $politique "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://api.anthropic.com; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'";

  # nginx n'hérite PAS les `add_header` d'un niveau supérieur dès qu'un bloc
  # en déclare un : chaque `location` doit donc les redéclarer, sans quoi les
  # fragments seraient servis sans politique de sécurité.
  location /assets/ {
    add_header Content-Security-Policy $politique always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location / {
    add_header Content-Security-Policy $politique always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header X-Frame-Options "DENY" always;
    # L'index n'est jamais immuable : un index périmé référencerait des
    # fragments hachés qui n'existent plus.
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /index.html;
  }
}
