server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Politique de sécurité stricte : pas d'`unsafe-eval`. Le mode par défaut
  # doit passer sous cette politique — c'est ce que vérifie le test de
  # non-régression `csp.navigateur.spec.ts`.
  #
  # `style-src` autorise `unsafe-inline` parce que Vue pose des styles en
  # ligne sur les transitions ; `font-src` et `style-src` ouvrent Google
  # Fonts, la seule ressource externe de la page.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://api.anthropic.com; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;

  # Les fragments hachés sont immuables ; l'index ne l'est jamais.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
