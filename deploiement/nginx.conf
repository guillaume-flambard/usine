server {
  listen 80;
  listen [::]:80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  # `script-src` autorise `unsafe-eval`, et c'est un arbitrage, pas un oubli :
  # les agents écrivent le code de leurs outils pendant le run, et ce code est
  # évalué dans l'onglet. Sans cette autorisation, aucun outil imprévu ne peut
  # exister — l'usine ne saurait qu'assembler un vocabulaire fermé.
  #
  # Ce que la politique tient malgré tout : aucune source de script externe,
  # aucune origine réseau hors relais et fournisseur, aucun cadre, aucun
  # formulaire sortant. Le code évalué vient du modèle, il est affiché au
  # visiteur avant de tourner, et la porte humaine reste devant la livraison.
  #
  # `style-src` autorise `unsafe-inline` parce que Vue pose des styles en
  # ligne ; `style-src` et `font-src` ouvrent Google Fonts, seule ressource
  # externe de la page. `connect-src` n'ouvre `api.anthropic.com` que pour le
  # mode LLM branché — en mode par défaut, aucune requête ne part.
  set $politique "default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://api.anthropic.com; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'";

  # nginx n'hérite PAS les `add_header` d'un niveau supérieur dès qu'un bloc
  # en déclare un : chaque `location` doit donc les redéclarer, sans quoi les
  # fragments seraient servis sans politique de sécurité.
  # Le relais du modèle. Le navigateur ne parle qu'à la même origine : la clé
  # OpenRouter reste sur le serveur, et `connect-src 'self'` suffit.
  #
  # `RELAIS_URL` est substitué au démarrage du conteneur (voir le Dockerfile :
  # `NGINX_ENVSUBST_FILTER` ne laisse passer que les variables `RELAIS_`), et
  # l'hôte est résolu à chaque requête par le DNS de Docker : sans relais
  # déployé, la route rend 502 au lieu d'empêcher nginx de démarrer. Le site
  # reste alors en mode déterministe, ce qu'il annonce.
  location ~ ^/api/(.*)$ {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $relais "${RELAIS_URL}";
    add_header Content-Security-Policy $politique always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control "no-store" always;
    proxy_pass $relais/$1$is_args$args;
    proxy_set_header Host $host;
    # Sans quoi le relais verrait une seule adresse pour tous les visiteurs,
    # et sa limite par minute serait partagée par la planète entière.
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Le relais peut être joint par son nom de service ou par un domaine
    # public : Coolify ne donne pas d'alias DNS stable à ses conteneurs, et
    # `proxy_ssl_server_name` est ce qui rend la seconde voie possible.
    proxy_ssl_server_name on;
    proxy_read_timeout 40s;
  }

  location /assets/ {
    add_header Content-Security-Policy $politique always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location / {
    add_header Content-Security-Policy $politique always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header X-Frame-Options "DENY" always;
    # L'index n'est jamais immuable : un index périmé référencerait des
    # fragments hachés qui n'existent plus.
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /index.html;
  }
}
