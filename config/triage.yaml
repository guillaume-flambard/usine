# Le tri quotidien des dépôts (ADR 0003).
#
# Les comptes lus chaque matin, et ce qui n'est jamais trié. Un dépôt à
# bénévoles (régime C de git-workflow.md) a sa propre relecture : l'usine n'y
# commente ni n'y ferme rien. Un nom seul (`mediterranean-rescue`) exclut ce
# dépôt chez n'importe quel propriétaire ; `owner/name` n'exclut que celui-là.
# L'exclusion est vérifiée au tri, puis juste avant d'agir.

accounts:
  - guillaume-flambard
  - memolabs-dev

excluded_repos:
  - mediterranean-rescue
  - sosmed-carto-recette

excluded_owners:
  - dataforgoodfr

# Un jeton par compte : un PAT à grain fin ne couvre qu'un propriétaire
# (docs.github.com, « Managing your personal access tokens », lu le 17 novembre
# 2026). On nomme ici la variable d'environnement, jamais la valeur. Chaque jeton :
# accès aux dépôts du compte, Issues et Pull requests en écriture, Contents et
# Metadata en lecture. Un compte sans jeton n'est pas lu, et le tri le dit.
tokens:
  guillaume-flambard: USINE_TRIAGE_TOKEN_GUILLAUME_FLAMBARD
  memolabs-dev: USINE_TRIAGE_TOKEN_MEMOLABS_DEV

# Seuils, en jours.
pr_after_days: 2
issue_after_days: 14
draft_after_days: 14
