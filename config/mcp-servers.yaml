# Les serveurs d'outils autorisés (MEM-37).
#
# Un agent nomme un serveur, jamais une adresse : c'est le service qui resout le
# nom vers l'URL, et un nom inconnu est refuse. Sans cette règle, une page
# publique qui relaye une adresse fournie par un modèle est un proxy ouvert.
#
# Un serveur absent de ce fichier n'existe pas. Un outil absent de `tools` n'est
# jamais exposé à l'agent, même si le serveur le propose.
#
# Niveaux de risque :
#   read         lit, ne modifie rien
#   write        modifie quelque chose de réversible
#   irreversible envoie, publie, supprime : passe obligatoirement par la porte
#                humaine (MEM-20) avant d'être exécuté
#
# Les secrets se désignent par le NOM d'une variable d'environnement, jamais par
# sa valeur : ce fichier est versionné.
#
# Exemple (décommenter et adapter) :
#
# servers:
#   - name: docs
#     url: https://mcp.exemple.test/mcp
#     description: la documentation publique du lab
#     token_env: MCP_DOCS_TOKEN        # facultatif
#     tools:
#       search: read
#       fetch: read
#   - name: annonces
#     url: https://mcp.exemple.test/annonces
#     description: les publications du lab
#     token_env: MCP_ANNONCES_TOKEN
#     tools:
#       list: read
#       draft: write
#       publish: irreversible

servers:
  # Serveur de démonstration : lecture seule du système de fichiers (MEM-82).
  # Démarré localement avec :
  #   DEMO_FILESYSTEM_ROOT=/chemin/vers/un/corpus \
  #   uv run python -m usine_api.demo_filesystem
  - name: demo-filesystem
    url: http://127.0.0.1:8761/mcp
    description: lecture seule d'un corpus de fichiers (démo)
    tools:
      list_directory: read
      read_file: read

  # Serveur de démonstration : lecture seule de GitHub (MEM-82).
  # Démarré localement avec :
  #   GITHUB_TOKEN=ghp_xxxx \
  #   uv run python -m usine_api.demo_github
  - name: demo-github
    url: http://127.0.0.1:8762/mcp
    description: lecture seule des dépôts GitHub du lab (démo)
    token_env: GITHUB_TOKEN
    tools:
      list_repos: read
      read_file: read
