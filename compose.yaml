# Compose de développement (MEM-7) : l'API et Postgres avec pgvector.
#
#   cp .env.example .env    # puis renseigner POSTGRES_PASSWORD
#   docker compose up -d --wait
#   curl http://127.0.0.1:8000/health
#
# Le front tourne hors conteneur (`pnpm dev`), et Vite proxifie /api vers
# 127.0.0.1:8000. Langfuse et LiteLLM restent les services partagés du lab,
# joints par les variables de .env : rien de tout cela ne tourne ici. La
# production aura son propre compose (MEM-58).
#
# Les ports ne sont publiés que sur 127.0.0.1 : rien n'est exposé sur le réseau
# local du poste.

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-usine}
      POSTGRES_DB: ${POSTGRES_DB:-usine}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?renseigner POSTGRES_PASSWORD dans .env}
    ports:
      - '127.0.0.1:${POSTGRES_PUBLISHED_PORT:-5432}:5432'
    volumes:
      - usine-dev-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile.dev
    env_file:
      - path: .env
        required: false
    environment:
      # Les morceaux, jamais la chaîne de connexion assemblée : le service
      # l'assemble à un seul endroit (usine_api/settings.py).
      POSTGRES_HOST: db
      POSTGRES_PORT: '5432'
      POSTGRES_USER: ${POSTGRES_USER:-usine}
      POSTGRES_DB: ${POSTGRES_DB:-usine}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?renseigner POSTGRES_PASSWORD dans .env}
      USINE_ORIGIN: ${USINE_ORIGIN:-http://127.0.0.1:5173}
    ports:
      - '127.0.0.1:${USINE_API_PORT:-8000}:8000'
    volumes:
      # Rechargement à chaud du code de l'API.
      - ./services/api/usine_api:/src/services/api/usine_api:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  usine-dev-db:
