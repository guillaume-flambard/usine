# uv workspace root. One lockfile for every Python member
# (https://docs.astral.sh/uv/concepts/projects/workspaces/). The root itself is
# not a package: it only gathers the members and the shared dev tools.
[project]
name = "usine-workspace"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = ["usine-api"]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
    "ruff>=0.14",
    "mypy>=2.4,<3",
]

[tool.uv]
package = false

[tool.uv.sources]
usine-api = { workspace = true }

[tool.uv.workspace]
members = ["services/api"]

[tool.pytest.ini_options]
testpaths = ["services/api/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
# One ruff config for the workspace: name the member packages first-party.
known-first-party = ["usine_api", "tests"]

[tool.mypy]
# Typed strictly, module by module, as the v2 code lands (MEM-11). The v1 code
# of services/api is not in the list yet.
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "services/api"
explicit_package_bases = true
files = [
    "services/api/usine_api/contracts",
    "services/api/usine_api/graph",
    "services/api/usine_api/cassette.py",
    "services/api/usine_api/checkpoints.py",
    "services/api/usine_api/comparison.py",
    "services/api/usine_api/compare.py",
    "services/api/usine_api/fork.py",
    "services/api/usine_api/specialists/",
    "services/api/usine_api/mcp_registry.py",
    "services/api/usine_api/models.py",
    "services/api/usine_api/chat_stream.py",
    "services/api/usine_api/observability.py",
    "services/api/usine_api/prompt_seed.py",
    "services/api/usine_api/threads.py",
    "services/api/usine_api/settings.py",
]

# CrewAI lives in its own environment (openai<3 against >=3.31 for Pydantic AI),
# so mypy cannot see its stubs here; the adapter is tested in that environment.
[[tool.mypy.overrides]]
module = "crewai.*"
ignore_missing_imports = true
# PyYAML ships no type stubs; the registry reads one small file.
[[tool.mypy.overrides]]
module = "yaml"
ignore_missing_imports = true
